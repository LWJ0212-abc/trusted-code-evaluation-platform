server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: platform_session
        http-only: true
        same-site: lax
        secure: ${TCEP_SESSION_SECURE:true}

spring:
  application:
    name: Server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${TCEP_DB_HOST:127.0.0.1}:${TCEP_DB_PORT:3308}/${TCEP_DB_NAME:tcep}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${TCEP_DB_USERNAME}
    password: ${TCEP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          m0:
            provider: keycloak
            client-id: tcep-m0
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8081/api/v1/auth/callback
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://127.0.0.1:8765/realms/tcep-m0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    root: INFO
    lwj.code.server: INFO
    lwj.code.server.identity.infrastructure.persistence.mapper: DEBUG
    org.mybatis: DEBUG

