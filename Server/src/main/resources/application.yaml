server:
  address: 127.0.0.1
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: platform_session
        http-only: true
        same-site: lax
        secure: ${TCEP_SESSION_SECURE:true}

spring:
  application:
    name: Server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${TCEP_DB_HOST:127.0.0.1}:${TCEP_DB_PORT:3309}/${TCEP_DB_NAME:code_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${TCEP_DB_USERNAME}
    password: ${TCEP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          m0:
            provider: keycloak
            client-id: tcep-m0
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8081/api/v1/auth/callback
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://127.0.0.1:8765/realms/tcep-m0

tcep:
  frontend-url: ${TCEP_FRONTEND_URL:http://127.0.0.1:5173/}
  object-store:
    endpoint: ${TCEP_OBJECT_STORE_ENDPOINT:http://127.0.0.1:19000}
    region: ${TCEP_OBJECT_STORE_REGION:us-east-1}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
    source-bucket: ${TCEP_SOURCE_BUCKET:tcep-source}
    result-bucket: ${TCEP_RESULT_BUCKET:tcep-result}
    staging-prefix: ${TCEP_OBJECT_STAGING_PREFIX:staging/}
    source-prefix: ${TCEP_OBJECT_SOURCE_PREFIX:submissions/}
    result-prefix: ${TCEP_OBJECT_RESULT_PREFIX:results/}
    staging-ttl: ${TCEP_OBJECT_STAGING_TTL:PT24H}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

logging:
  level:
    root: INFO
    lwj.code.server: INFO
    lwj.code.server.identity.infrastructure.persistence.mapper: DEBUG
    org.mybatis: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
